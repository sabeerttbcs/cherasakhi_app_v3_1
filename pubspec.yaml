name: kuri_collective
description: CheraSakhi - Cheramoola Neighbourhood Women. Kuri tracker, Pamparam lucky draw and Tour & Party wallet.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  flutter_riverpod: ^2.6.1
  google_fonts: ^6.2.1
  intl: ^0.19.0
  url_launcher: ^6.3.1
  confetti: ^0.8.0
  share_plus: ^10.1.2
  path_provider: ^2.1.4
  audioplayers: ^6.1.0
  flutter_local_notifications: ^18.0.1
  web: ^1.1.0
  crypto: ^3.0.6
  pdf: ^3.11.3
  printing: ^5.13.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/brand/
    - assets/fonts/

# App icon: run `dart run flutter_launcher_icons`
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/app_icon.png
  adaptive_icon_background: "#831843"
  adaptive_icon_foreground: assets/brand/app_icon_foreground.png
  remove_alpha_ios: true
